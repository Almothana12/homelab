machine:
  nodeLabels:
    nvidia.com/device-plugin.config: gpu-2 # key in the time-slicing-config-fine ConfigMap (infrastructure/gpu-operator)
  network:
    hostname: gpu-2
    interfaces:
      - interface: enP7s7
        addresses:
          - 192.168.0.65/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.0.1
        dhcp: true
    nameservers:
      - 192.168.0.2
