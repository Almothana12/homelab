machine:
  kubelet:
    nodeIP:
      # Keep Kubernetes/Cilium on the management LAN, not the direct GPU links.
      validSubnets:
        - 192.168.0.65/32
        - 2000::/3
  network:
    hostname: gpu-2
    interfaces:
      - interface: enP7s7
        addresses:
          - 192.168.0.65/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.0.1
        dhcp: true
      - interface: enP2p1s0f0np0
        dhcp: false
        mtu: 1500
        addresses:
          - 10.100.217.1/24
      - interface: enp1s0f0np0
        dhcp: false
        mtu: 1500
        addresses:
          - 10.100.216.1/24
      - interface: enP2p1s0f1np1
        dhcp: false
      - interface: enp1s0f1np1
        dhcp: false
    nameservers:
      - 192.168.0.2
