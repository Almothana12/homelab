# https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/hardware-and-drivers/nvidia-gpu-proprietary#enabling-the-nvidia-modules-and-the-system-extension
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
---
# RDMA and infiniband
apiVersion: v1alpha1
kind: KernelModuleConfig
name: ib_umad
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: rdma_ucm
---
# since GPU nodes are unified memory, reserve some memory for the system and kubelet to avoid node becoming unresponsive when GPU memory is allocated
apiVersion: v1alpha1
kind: KubeletConfig
config:
  systemReserved:
    memory: 3Gi
    cpu: 500m
  kubeReserved:
    memory: 1Gi
    cpu: 500m
  # Evict before the node becomes unresponsive.
  evictionHard:
    memory.available: 4Gi
    nodefs.available: 10%
  evictionSoft:
    memory.available: 6Gi
  evictionSoftGracePeriod:
    memory.available: 1m30s
  # Give a terminating pod time to release GPU memory cleanly.
  evictionMaxPodGracePeriod: 60
