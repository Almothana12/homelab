apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 5m
  timeout: 10m
  # The migrations hook can run before the CNPG primary accepts connections
  # on first install; retry rather than stall.
  install:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: litellm
  values:

    masterkeySecretName: litellm-masterkey
    masterkeySecretKey: LITELLM_MASTER_KEY
    environmentSecrets:
      - litellm-env

    # CNPG instead of the bundled Bitnami Postgres.
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-cluster-rw
      database: app
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)
      secret:
        name: litellm-cluster-v00-app
        usernameKey: username
        passwordKey: password

    envVars:
      # Use the cost map bundled in the image instead of fetching it from
      # GitHub at startup; egress to the Internet is not allowed.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # UI blog panel uses the copy bundled in the image instead of fetching docs.litellm.ai
      LITELLM_LOCAL_BLOG_POSTS: "True"
      # Prisma update check / telemetry to checkpoint.prisma.io
      CHECKPOINT_DISABLE: "1"
      # Base URL for SSO redirects
      PROXY_BASE_URL: https://litellm.almothana.xyz
      # Cilium Ingress is an L7 Envoy proxy: it opens a new connection to the
      # pod from its own reserved:ingress IP (10.244.x.x) and passes the client
      # in X-Forwarded-For. Uvicorn only honours XFF from 127.0.0.1 by default,
      # so trust the pod CIDR (the CNP limits :4000 to ingress, Newt and Open
      # WebUI). Uvicorn takes the rightmost untrusted hop, so a client-forged
      # XFF cannot spoof its address.
      FORWARDED_ALLOW_IPS: "10.244.0.0/16,fd00:10:244::/48"

    proxy_config:
      model_list:
        - model_name: ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
          litellm_params:
            model: hosted_vllm/ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
            api_base: http://vllm-tp-api.ai.svc.cluster.local:8000/v1
            input_cost_per_token: 0.00000001    # $0.01 per 1M input tokens
            output_cost_per_token: 0.00000015   # $0.15 per 1M output tokens
          model_info:
            max_input_tokens: 131072 # Keep in sync with --max-model-len in
            max_output_tokens: 131072
        - model_name: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
          litellm_params:
            model: hosted_vllm/unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
            api_base: http://qwen38-flash-next-llamacpp.ai.svc.cluster.local:8080/v1
          model_info:
            max_input_tokens: 131072 # Keep in sync with --ctx-size
            max_output_tokens: 131072
      router_settings:
        model_group_alias:
          default: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
          coder: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
          fast: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
      litellm_settings:
        callbacks: ["smtp_email"]
      general_settings:
        store_model_in_db: true
        alerting: ["email"]
        disable_env_credential_login: true
        # Open WebUI shares one key; attribute spend to the end user it forwards.
        user_header_name: X-OpenWebUI-User-Email

    ingress:
      enabled: true
      className: cilium
      hosts:
        - host: ai.almothana.xyz
          paths:
            - path: /
              pathType: Prefix
        - host: litellm.almothana.xyz
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ai.almothana.xyz
            - litellm.almothana.xyz
          secretName: almothana-xyz-tls

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
