apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 5m
  timeout: 10m
  # The migrations hook can run before the CNPG primary accepts connections
  # on first install; retry rather than stall.
  install:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: litellm
  values:

    masterkeySecretName: litellm-masterkey
    masterkeySecretKey: LITELLM_MASTER_KEY
    environmentSecrets:
      - litellm-env

    # CNPG instead of the bundled Bitnami Postgres.
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-cluster-rw
      database: app
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)
      secret:
        name: litellm-cluster-v00-app
        usernameKey: username
        passwordKey: password

    envVars:
      # Use the cost map bundled in the image instead of fetching it from
      # GitHub at startup; egress to the Internet is not allowed.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # UI blog panel uses the copy bundled in the image instead of fetching docs.litellm.ai
      LITELLM_LOCAL_BLOG_POSTS: "True"
      # Prisma update check / telemetry to checkpoint.prisma.io
      CHECKPOINT_DISABLE: "1"
      # Base URL for SSO redirects
      PROXY_BASE_URL: https://litellm.almothana.xyz

    proxy_config:
      model_list:
        - model_name: ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
          litellm_params:
            model: hosted_vllm/ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
            api_base: http://vllm-tp-api.ai.svc.cluster.local:8000/v1
            input_cost_per_token: 0.00000001    # $0.01 per 1M input tokens
            output_cost_per_token: 0.00000015   # $0.15 per 1M output tokens
        - model_name: orcarouter/Qwen3.8-27B-Uncensored-NVFP4
          litellm_params:
            model: hosted_vllm/orcarouter/Qwen3.8-27B-Uncensored-NVFP4
            api_base: http://vllm-unc-tp-api.ai.svc.cluster.local:8000/v1
            input_cost_per_token: 0.00000001    # $0.01 per 1M input tokens
            output_cost_per_token: 0.00000015   # $0.15 per 1M output tokens
      router_settings:
        model_group_alias:
          default: ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
          coder: ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
          fast: ukisai/Swift-1.5-Qwen3.8-27b-NVFP4
      litellm_settings:
        # One replica per model: a retry lands on the same engine, so it only
        # adds load while the engine is struggling.
        num_retries: 0
        callbacks: ["smtp_email"]
      general_settings:
        # Models are managed here in git only, not added through the UI.
        store_model_in_db: false
        alerting: ["email"]
        disable_env_credential_login: true
        # Open WebUI shares one key; attribute spend to the end user it forwards.
        user_header_name: X-OpenWebUI-User-Email

    ingress:
      enabled: true
      className: cilium
      hosts:
        - host: ai.almothana.xyz
          paths:
            - path: /
              pathType: Prefix
        - host: litellm.almothana.xyz
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ai.almothana.xyz
            - litellm.almothana.xyz
          secretName: almothana-xyz-tls

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
