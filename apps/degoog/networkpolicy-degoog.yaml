apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: degoog
spec:
  endpointSelector:
    matchLabels:
      app: degoog
  ingress:
    # From Ingress (LAN only, no Newt/Pangolin)
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4444"
              protocol: TCP
  egress:
    # To DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # Store: official-extensions git clone, core fetches
        - matchName: github.com
        - matchName: raw.githubusercontent.com
        # Engines: google, bing, brave, duckduckgo, startpage, wikipedia
        - matchName: www.google.com
        - matchName: www.bing.com
        - matchName: search.brave.com
        - matchName: duckduckgo.com
        - matchName: html.duckduckgo.com
        - matchName: www.startpage.com
        - matchPattern: "*.wikipedia.org"
        # Autocomplete + favicons
        - matchName: api.duckduckgo.com
        - matchName: icons.duckduckgo.com
        # Plugins: math-slot, define, weather/time
        - matchName: api.mathjs.org
        - matchName: api.dictionaryapi.dev
        - matchName: api.open-meteo.com
        - matchName: geocoding-api.open-meteo.com
        # Google favicons: www.google.com/s2/favicons redirects to t0-t3.gstatic.com
        - matchPattern: "t*.gstatic.com"
        # Store repo avatar
        - matchName: avatars.githubusercontent.com
        # Engines: reddit, hacker-news, yandex-visual
        - matchName: www.reddit.com
        - matchName: hn.algolia.com
        - matchName: yandex.com
        # Plugins: github-slot (+ Degoog's own update check), tmdb-slot, spell-check
        - matchName: api.github.com
        - matchName: api.themoviedb.org
        - matchName: image.tmdb.org
        - matchName: speller.yandex.net
        # Wikipedia knowledge-panel images
        - matchName: upload.wikimedia.org
        # Third-party engine overstylefr/degoog-git-search: Docker Hub
        - matchName: hub.docker.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Built-in IP Lookup (!ip): the server queries http://ip-api.com/json/<ip>.
    # Plain HTTP because ip-api's free tier has no HTTPS. (api.ipify.org, for
    # "my IP", is fetched by the browser, not the pod.)
    - toFQDNs:
        - matchName: ip-api.com
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
