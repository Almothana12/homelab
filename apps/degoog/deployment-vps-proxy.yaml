
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vps-proxy
  name: vps-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vps-proxy
  template:
    metadata:
      labels:
        app: vps-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # nobody: exists in the Alpine image (ssh refuses to run for a uid with no passwd entry)
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh
          # Alpine + openssh-client, multi-arch. Only `ssh` is used.
          image: docker.io/alpine/git:v2.54.1
          command:
            - ssh
            - -N
            - -F
            - /dev/null
            - -i
            - /ssh/key/id_ed25519
            - -o
            - IdentitiesOnly=yes
            - -o
            - BatchMode=yes
            - -o
            - StrictHostKeyChecking=yes
            - -o
            - UserKnownHostsFile=/ssh/known_hosts/known_hosts
            # Exit when the link dies; Kubernetes restarts the container to reconnect
            - -o
            - ExitOnForwardFailure=yes
            - -o
            - ServerAliveInterval=15
            - -o
            - ServerAliveCountMax=3
            - -o
            - ConnectTimeout=15
            # Listen on all pod addresses (access limited by the network policy)
            - -o
            - GatewayPorts=yes
            - -D
            - "1080"
            - degoog-proxy@195.20.235.239
          ports:
            - name: socks
              containerPort: 1080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: socks
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: socks
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: key
              mountPath: /ssh/key
              readOnly: true
            - name: known-hosts
              mountPath: /ssh/known_hosts
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: degoog-vps-proxy-ssh
            # root-owned + group-readable: ssh only enforces 0600 on keys the user owns
            defaultMode: 0440
        - name: known-hosts
          configMap:
            name: vps-proxy
