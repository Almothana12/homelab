apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: lubelogger-data
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-lubelogger-data
        destinationPVC: lubelogger-data-lubelogger-0
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
