# this restore finished. Flux creates it once (ssa: IfNotPresent); its trigger runs once.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: seerr
    namespace: media
    labels:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-seerr
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        storageClassName: rawfile-localpv
        accessModes:
            - ReadWriteOnce
        capacity: 512Mi
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
