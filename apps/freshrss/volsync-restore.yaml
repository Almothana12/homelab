apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: freshrss
    namespace: plex
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-freshrss
        destinationPVC: freshrss
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
