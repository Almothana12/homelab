apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-mcp
  labels:
    app: homelable-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelable-mcp
  template:
    metadata:
      labels:
        app: homelable-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/pouzor/homelable-mcp:3.6
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: http://backend:8000
          envFrom:
            - secretRef:
                name: homelable-mcp
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
