# Restore through the VolSync volume populator: the PVC (dataSourceRef) stays Pending until
# this restore finished. Flux creates it once (ssa: IfNotPresent); its trigger runs once.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: bulwark
    namespace: bulwark
    labels:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-bulwark
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        storageClassName: rawfile-localpv
        accessModes:
            - ReadWriteOnce
        capacity: 1Gi
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
sops:
