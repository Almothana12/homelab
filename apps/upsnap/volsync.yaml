apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
    name: upsnap
spec:
    sourcePVC: upsnap
    trigger:
        schedule: 0 23 * * *
    restic:
        pruneIntervalDays: 7
        repository: restic-config-upsnap
        retain:
            hourly: 1
            daily: 7
            weekly: 4
            monthly: 2
            yearly: 1
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
