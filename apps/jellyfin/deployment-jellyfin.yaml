apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: jellyfin/jellyfin:12.4
          name: jellyfin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
            limits:
              # iGPU for transcoding
              gpu.intel.com/i915: "1"
          env:
            - name: TZ
              value: Asia/Riyadh
            # Keep the linuxserver /config layout already on the PVC.
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /config/cache
            - name: JELLYFIN_LOG_DIR
              value: /config/log
            - name: XDG_CACHE_HOME
              value: /config/cache
            - name: HOME
              value: /config
          ports:
            - containerPort: 8096
              name: http
              protocol: TCP
            - containerPort: 7359
              protocol: UDP
            - containerPort: 1900
              protocol: UDP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: jellyfin
            # Scratch transcode segments off the PVC: they are not backed up by VolSync,
            # can't eat the free space Jellyfin requires at startup, and are wiped on restart.
            - mountPath: /config/cache/transcodes
              name: transcodes
            - mountPath: /data/Movies
              name: library
              subPath: movies
            - mountPath: /data/TVShows
              name: library
              subPath: tv-shows
            - mountPath: /data/Anime
              name: library
              subPath: anime
            - mountPath: /data/MyAnime
              name: library
              subPath: myanime
            - mountPath: /data/Music
              name: library
              subPath: music
            - mountPath: /data/Books
              name: library
              subPath: books
            - mountPath: /data/Pictures
              name: library
              subPath: pictures
            - mountPath: /data/PS4
              name: library
              subPath: PS4
            - mountPath: /data/VHS
              name: library
              subPath: video
      restartPolicy: Always
      volumes:
        - name: jellyfin
          persistentVolumeClaim:
            claimName: jellyfin
        - name: transcodes
          emptyDir:
            sizeLimit: 20Gi
        - name: library
          persistentVolumeClaim:
            claimName: plex-library