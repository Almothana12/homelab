# Restore through the VolSync volume populator: the PVC (dataSourceRef) stays Pending until
# this restore finished. Flux creates it once (ssa: IfNotPresent); its trigger runs once.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: pinchflat
    namespace: plex
    labels:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-pinchflat
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        storageClassName: rawfile-localpv
        accessModes:
            - ReadWriteOnce
        capacity: 256Mi
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
