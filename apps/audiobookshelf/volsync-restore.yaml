apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: audiobookshelf-config
    namespace: plex
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-audiobookshelf-config
        destinationPVC: audiobookshelf-config
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch

---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: audiobookshelf-metadata
    namespace: plex
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-audiobookshelf-metadata
        destinationPVC: audiobookshelf-metadata
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
