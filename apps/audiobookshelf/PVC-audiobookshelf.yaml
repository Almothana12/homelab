apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf-config
spec:
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: audiobookshelf-config
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf-metadata
spec:
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: audiobookshelf-metadata
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
