        manual: restore-once
    restic:
        repository: restic-config-tracktor-1
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        storageClassName: rawfile-localpv
        accessModes:
            - ReadWriteOnce
