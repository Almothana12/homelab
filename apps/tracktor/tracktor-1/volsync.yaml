apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
    name: tracktor-1
spec:
    sourcePVC: tracktor-1
    trigger:
        schedule: 0 22 * * *
    restic:
        pruneIntervalDays: 7
        repository: restic-config-tracktor-1
        retain:
            hourly: 1
            daily: 7
            weekly: 4
            monthly: 2
            yearly: 1
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        # Rawfile snapshots stay on the node of the source PVC. Run the mover next to the
        # app pod so the snapshot-backed PVC it mounts is provisioned on that same node.
        moverAffinity:
            podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                            app: tracktor-1
                      topologyKey: kubernetes.io/hostname
# Restore through the VolSync volume populator: the PVC (dataSourceRef) stays Pending until
