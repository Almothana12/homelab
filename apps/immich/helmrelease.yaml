apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: immich
      version: '0.13.4'
      sourceRef:
        kind: HelmRepository
        name: immich
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.3.4
            env:
              DB_DATABASE_NAME: "app"
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-cluster-v03-superuser
                    key: host
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-cluster-v03-superuser
                    key: password
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-cluster-v03-superuser
                    key: username
              TZ: Asia/Riyadh
    immich:
      persistence:
        library:
          existingClaim: immich-library
    valkey:
      enabled: true
    server:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  memory: 600Mi
      persistence:
        extrapv:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: "external-library"
      ingress:
        main:
          enabled: true
          hosts:
            - host: immich.almothana.xyz
              paths:
                - path: "/"
          tls:
            - secretName: almothana-xyz-tls
              hosts:
              - immich.almothana.xyz
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  memory: 256Mi
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
