apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: plex-config
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-plex-config
        destinationPVC: pms-config-plex-plex-media-server-0
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
