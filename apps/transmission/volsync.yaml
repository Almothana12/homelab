apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
    name: transmission
spec:
    sourcePVC: transmission
    trigger:
        schedule: 0 12 * * *
    restic:
        pruneIntervalDays: 7
        repository: restic-config-transmission
        retain:
            hourly: 1
            daily: 7
            weekly: 4
            monthly: 2
            yearly: 1
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        # Rawfile snapshots stay on the node of the source PVC. Run the mover next to the
        # app pod so the snapshot-backed PVC it mounts is provisioned on that same node.
        moverAffinity:
            podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                            app: transmission
                      topologyKey: kubernetes.io/hostname
# Restore through the VolSync volume populator: the PVC (dataSourceRef) stays Pending until
sops:
    kms: []
    gcp_kms: []
    azure_kv: []
