apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
spec:
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: speedtest-tracker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi