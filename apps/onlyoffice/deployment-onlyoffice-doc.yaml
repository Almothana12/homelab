apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: onlyoffice
  name: onlyoffice-doc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:

      containers:
        - image: onlyoffice/documentserver:10.0.0
          imagePullPolicy: IfNotPresent
          name: documentserver
          volumeMounts:
            - name: data
              mountPath: /var/www/onlyoffice/Data
            - name: lib
              mountPath: /var/lib/onlyoffice
            - name: db
              mountPath: /var/lib/postgresql
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: JWT_SECRET
            - name: WOPI_ENABLED
              value: "true"
            # Since 10.0 every WOPI host must be named by an explicit ipfilter rule ("*" no longer
            # counts). Rules match in order; "allow all" keeps the previous default for everything else.
            - name: IP_FILTER_RULES
              value: "allow collaboration-onlyoffice.ocis.svc.cluster.local; allow all"
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onlyoffice-data
        - name: lib
          persistentVolumeClaim:
            claimName: onlyoffice-lib
        - name: db
          persistentVolumeClaim:
            claimName: onlyoffice-db