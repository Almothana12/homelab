apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - PVC-home-assistant.yaml
  - deployment-home-assistant.yaml
  - service-home-assistant.yaml
  - ingress-home-assistant.yaml
  - secret-restic-home-assistant.yaml
  - volsync.yaml

configMapGenerator:
  - name: home-assistant-config
    files:
      - configuration.yaml
