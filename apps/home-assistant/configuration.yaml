
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# power metrics for the cluster Prometheus
prometheus:
  requires_auth: false
  filter:
    include_entities:
      - sensor.bedroom_shelly_gpu_1_gpu_1_power
      - sensor.bedroom_shelly_gpu_1_gpu_1_energy
      - sensor.homelab_shelly_gpu_2_power
      - sensor.homelab_shelly_gpu_2_energy
      - sensor.bedroom_shelly_homelab_shelly_homelab_power
      - sensor.bedroom_shelly_homelab_shelly_homelab_energy
