apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost
          image: maximhq/bifrost:v2.2.3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: bifrost-keys
          env:
            - name: APP_DIR
              value: /app/data
            - name: BIFROST_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-keys
                  key: BIFROST_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-data
        - name: tmp
          emptyDir: {}
