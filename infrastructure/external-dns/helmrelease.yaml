apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: '1.23.0'
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 5m
  values:
    policy: sync
    registry: txt
    txtOwnerId: homelab
    sources:
      - service
      - ingress
    domainFilters:
      - almothana.xyz
      - almothana.sa
    # Technitium via RFC 2136 dynamic updates, signed with a TSIG key.
    # Both zones are Technitium "Conditional Forwarder" zones: names that
    # external-dns writes are answered locally, every other name in the zone
    # (public records on the VPS, MX, ...) is forwarded upstream.
    provider:
      name: rfc2136
    extraArgs:
      # Only the cluster PRIMARY accepts zone transfers (AXFR, used to list
      # records). Secondaries hold read-only copies.
      rfc2136-host: technitium-primary-dns.technitium.svc.cluster.local
      rfc2136-port: 53
      rfc2136-zone:
        - almothana.xyz
        - almothana.sa
      rfc2136-tsig-keyname: external-dns
      rfc2136-tsig-secret-alg: hmac-sha256
      rfc2136-axfr: true
    env:
      # Same as --rfc2136-tsig-secret (every flag maps to EXTERNAL_DNS_<FLAG>).
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-tsig
            key: secret
