apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-llamacpp
  labels:
    app.kubernetes.io/name: qwen38-flash-next-llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen38-flash-next-llamacpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen38-flash-next-llamacpp
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-2
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b11515
          imagePullPolicy: IfNotPresent
          args:
            - -hf
            - unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 96Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen38-flash-next-llamacpp-cache
