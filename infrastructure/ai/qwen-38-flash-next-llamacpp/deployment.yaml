apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-llamacpp
  labels:
    app.kubernetes.io/name: qwen38-flash-next-llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen38-flash-next-llamacpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen38-flash-next-llamacpp
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-2
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b11515
          imagePullPolicy: IfNotPresent
          # env:
          #   # Cache Hub downloads through Olah
          #   - name: HF_ENDPOINT
          #     value: http://olah.olah.svc.cluster.local
          args:
            - -hf
            - ukisai/Swift-1.5-Qwen3.8-Flash-Next-GGUF:IQ4_XS
            - -hfd
            - unsloth/Qwen3.8-Flash-Next-GGUF
            - -md
            - mtp-Qwen3.8-Flash-Next-Q8_0.gguf
            - --host
            - 0.0.0.0
            - --alias
            - ukisai/Swift-1.5-Qwen3.8-Flash-Next-GGUF:IQ4_XS
            - --ctx-size
            - "131072"
            # GB10's integrated GPU makes auto keep the large PLE tables resident.
            - --lazy-mode
            - "on"
            - --min-p
            - "0.0"
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "3"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 96Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface/hub
              readOnly: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen38-flash-next-llamacpp-cache
