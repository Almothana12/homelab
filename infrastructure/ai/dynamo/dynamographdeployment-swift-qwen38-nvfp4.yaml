apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-model-swift-qwen38-nvfp4
  annotations:
    nvidia.com/kai-scheduler-queue: dynamo
    nvidia.com/vllm-distributed-executor-backend: mp
spec:
  components:
    - name: VllmWorker
      type: worker
      replicas: 1
      multinode:
        nodeCount: 2
      modelRef:
        name: ukisai/Swift-Qwen3.8-27B-NVFP4
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: dynamo-model-swift-qwen38-nvfp4
            app.kubernetes.io/component: worker
        spec:
          runtimeClassName: nvidia
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          terminationGracePeriodSeconds: 60
          nodeSelector:
            kubernetes.io/arch: arm64
            node-role.kubernetes.io/gpu: ""
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: dynamo-model-swift-qwen38-nvfp4
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          # NCCL's RoCE transport registers pinned memory through ibverbs.
          # The Dynamo image defaults to UID 1000, where Kubernetes cannot set
          # an unlimited RLIMIT_MEMLOCK. Run as root with only IPC_LOCK retained
          # below so ibv_reg_mr can bypass that limit, matching the proven llm-d
          # TP=2 pods on these nodes.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/examples/backends/vllm
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - ukisai/Swift-Qwen3.8-27B-NVFP4
                - --tensor-parallel-size
                - "2"
                - --pipeline-parallel-size
                - "1"
                - --gpu-memory-utilization
                - "0.30"
                - --kv-cache-memory-bytes
                - 16G
                - --enable-prefix-caching
                - --max-num-seqs
                - "8"
                - --kv-cache-dtype
                - fp8
                # Publish model-specific parser names through Dynamo runtime
                # metadata; these are not native vLLM API-server options.
                - --dyn-tool-call-parser
                - qwen3_coder
                - --dyn-reasoning-parser
                - qwen3
                - --speculative-config
                - '{"method":"mtp","num_speculative_tokens":3}'
              env:
                - name: HF_HOME
                  value: /data/huggingface
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token
                      key: token
                - name: VLLM_CACHE_ROOT
                  value: /data/vllm-cache
                - name: CUDA_CACHE_PATH
                  value: /data/nv-compute-cache
                - name: VLLM_USE_V2_MODEL_RUNNER
                  value: "1"
                # Keep control traffic and Gloo on the direct rail. NCCL uses
                # the matching mlx5_2 RoCE HCA supplied by the device plugin.
                - name: NCCL_SOCKET_IFNAME
                  value: enP2p1s0f0np0
                - name: GLOO_SOCKET_IFNAME
                  value: enP2p1s0f0np0
                - name: NCCL_SOCKET_FAMILY
                  value: AF_INET
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_NET
                  value: IB
                - name: NCCL_IB_HCA
                  value: "=mlx5_2:1"
                - name: NCCL_IB_ADDR_FAMILY
                  value: AF_INET
                - name: NCCL_IB_ADDR_RANGE
                  value: 10.100.217.0/24
                - name: NCCL_DEBUG
                  value: INFO
                # Reserve model-specific host-network ports so a second model
                # can use a different set on the same two physical nodes.
                - name: DYN_SYSTEM_PORT
                  value: "9091"
                - name: NIXL_TELEMETRY_PROMETHEUS_PORT
                  value: "19091"
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: "20381"
              ports:
                - name: health
                  containerPort: 9091
              resources:
                requests:
                  cpu: "6"
                  memory: 24Gi
                  nvidia.com/gpu: "1"
                  rdma/direct_rail: "1"
                limits:
                  cpu: "6"
                  memory: 24Gi
                  nvidia.com/gpu: "1"
                  rdma/direct_rail: "1"
              startupProbe:
                httpGet:
                  path: /live
                  port: health
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 360
              readinessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
              livenessProbe:
                httpGet:
                  path: /live
                  port: health
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - IPC_LOCK
              volumeMounts:
                - name: model-cache
                  mountPath: /data
                - name: shm
                  mountPath: /dev/shm
          volumes:
            # Generic ephemeral volumes create one node-local RWO PVC per
            # Grove rank, avoiding a cross-node RWO mount conflict.
            - name: model-cache
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    labels:
                      app.kubernetes.io/name: dynamo-model-swift-qwen38-nvfp4
                      app.kubernetes.io/component: model-cache
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    storageClassName: openebs-hostpath
                    resources:
                      requests:
                        storage: 80Gi
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
