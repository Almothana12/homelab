# Explicit route for the model-discovery endpoints.
#
# Why this exists: both model routes match on X-Gateway-Base-Model-Name, which
# IPP only sets from a JSON body containing "model". A GET has no body, so it
# would match neither route and start returning 404 -- and GET /v1/models
# currently returns 200 through this Gateway, so that would be a regression for
# any OpenAI client (Open WebUI calls it to populate its model picker).
#
# IPP itself is not a problem for these requests: both its plugins return early
# without error when the body has no "model" field, so a bodyless GET traverses
# the fail-closed ext_proc filter and arrives here with no header set.
#
# Scope is deliberately narrow. This matches only the two read-only discovery
# paths, NEVER a "/" prefix -- a catch-all would swallow malformed and
# unknown-model completion requests and hand them to an arbitrary model.
#
# Known limitation: this returns the model list of ONE pool, so the uncensored
# model does not appear in it. Clients that trust /v1/models will not offer it;
# addressing that needs a small aggregating endpoint, which is deliberately not
# built here. Inference routing for both models is unaffected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-model-discovery
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/models
          method: GET
        - path:
            type: Exact
            value: /version
          method: GET
      backendRefs:
        # A plain Service, not an InferencePool: discovery needs no
        # load-aware endpoint selection and must not depend on an EPP.
        - group: ""
          kind: Service
          name: vllm-tp-api
          port: 8000
