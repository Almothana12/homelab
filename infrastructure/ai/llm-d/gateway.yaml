apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-inference-gateway
  annotations:
    networking.istio.io/service-type: LoadBalancer
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      # Istio copies this to the generated LoadBalancer Service for ExternalDNS.
      external-dns.alpha.kubernetes.io/hostname: ai.almothana.xyz
  listeners:
    - name: https
      hostname: ai.almothana.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: almothana-xyz-tls
      allowedRoutes:
        namespaces:
          from: Same
