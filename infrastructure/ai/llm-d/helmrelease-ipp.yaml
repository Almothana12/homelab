apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payload-processor
spec:
  interval: 5m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: payload-processor
  values:
    provider:
      name: istio
      # Only the request path is used. Every enabled event adds a proxy->IPP
      # network hop per request, and the plugins here read the request body
      # only, so the response events are turned off. The chart ships these
      # enabled by default even though its own README documents them as false.
      supportedEvents:
        requestHeaders: true
        requestBody: true
        requestTrailers: true
        responseHeaders: false
        responseBody: false
        responseTrailers: false
      istio:
        envoyFilter:
          # IPP must see the body before routing is decided, so its ext_proc
          # filter goes ahead of the EPP filters in the chain.
          operation: INSERT_FIRST
    inferenceGateway:
      # Attaches the generated EnvoyFilter to the existing Gateway via targetRefs.
      name: llm-d-inference-gateway
    payloadProcessor:
      name: payload-processor
      # Two replicas deliberately. The generated EnvoyFilter sets
      # failure_mode_allow: false, so if every IPP pod is unreachable the
      # gateway rejects EVERY inference request before a pool is chosen -- the
      # EPP's FailOpen does not cover this, it only applies after pool
      # selection. Fail-closed is the right choice (bypassing IPP would route
      # to an arbitrary model), so the dependency is made redundant instead.
      replicas: 2
      # Default config (body-field-to-header + base-model-to-header) is kept.
      # base-model-to-header is what emits X-Gateway-Base-Model-Name, and it
      # resolves a name only if a ConfigMap labelled inference.llm-d.ai/ipp-managed
      # registers it; an unregistered model yields an empty header and matches
      # no route, which is the desired explicit 404 rather than a wrong backend.
      flags:
        v: 3
