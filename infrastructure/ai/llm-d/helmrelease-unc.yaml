apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-d-router-orcarouter-qwen3-8-27b-uncensored-nvfp4
spec:
  interval: 5m
  timeout: 10m
  dependsOn:
    - name: payload-processor
  chartRef:
    kind: OCIRepository
    name: llm-d-router-gateway
  values:
    provider:
      name: istio

    httpRoute:
      create: true
      inferenceGatewayName: llm-d-inference-gateway
      requestTimeout: 300s
      baseModel: orcarouter/Qwen3.8-27B-Uncensored-NVFP4

    router:
      modelServers:
        type: vllm
        protocol: http
        matchLabels:
          app.kubernetes.io/name: vllm-unc-tp
          app.kubernetes.io/component: leader
        targetPorts:
          # The engine's own port, not the Service port: an InferencePool selects
          # pods directly and bypasses the Service.
          - number: 8001

      inferencePool:
        failureMode: FailOpen # if EPP fails, continue the request without intelligent endpoint selection

      epp:
        replicas: 1
        parsers:
          - openai-parser
        flags:
          v: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 2Gi
