apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
    name: openbao
spec:
    trigger:
        manual: restore-once
    restic:
        repository: restic-config-openbao
        destinationPVC: data-openbao-0
        copyMethod: Direct
        cleanupCachePVC: true
        cleanupTempPVC: true
        moverSecurityContext:
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
