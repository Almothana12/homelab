apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: gpu-operator
      version: 'v26.7.0'
      sourceRef:
        kind: HelmRepository
        name: nvidia
      interval: 5m
  values: # https://docs.siderolabs.com/talos/v1.14/configure-your-talos-cluster/hardware-and-drivers/nvidia-gpu-proprietary#deploying-nvidia-gpu-operator
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
