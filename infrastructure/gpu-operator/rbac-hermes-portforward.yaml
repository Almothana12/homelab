---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-portforward
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-portforward
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-portforward
