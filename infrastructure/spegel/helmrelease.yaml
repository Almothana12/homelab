apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 5m
  chart:
    spec:
      chart: spegel
      version: '0.8.0'
      sourceRef:
        kind: HelmRepository
        name: spegel
      interval: 5m
  values: 
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts # Required for Talos
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    # Enabled monitoring
    serviceMonitor:
      enabled: true
