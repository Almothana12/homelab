# Client-facing DNS VIP
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  annotations:
    lbipam.cilium.io/ips: 192.168.0.250
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app: technitium
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
