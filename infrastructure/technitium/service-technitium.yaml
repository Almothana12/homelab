# Headless governing Service required by the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  clusterIP: None
  selector:
    app: technitium
  ports:
    - name: web
      port: 5380
      protocol: TCP
---
# Web console of the cluster PRIMARY only.
apiVersion: v1
kind: Service
metadata:
  name: technitium-web
spec:
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: web
      port: 5380
      targetPort: web
      protocol: TCP
