apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: technitium-0
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  trigger:
    manual: restore-once
  restic:
    repository: restic-config-technitium-0
    copyMethod: Snapshot
    volumeSnapshotClassName: rawfile-localpv
    # Restore on the instance's node: the rawfile snapshot (and so the restored
    # PVC) stays where the mover ran, and the Deployment is pinned to this node.
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - master-1
    storageClassName: rawfile-localpv
    accessModes:
      - ReadWriteOnce
    capacity: 2Gi
    cleanupCachePVC: true
    cleanupTempPVC: true
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
      fsGroupChangePolicy: OnRootMismatch
---
