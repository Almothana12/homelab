apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: technitium-0
spec:
  sourcePVC: config-technitium-0
  trigger:
    schedule: 0 4 * * *
  restic:
    pruneIntervalDays: 7
    repository: restic-config-technitium-0
    retain:
      hourly: 1
      daily: 7
      weekly: 4
      monthly: 2
      yearly: 1
    copyMethod: Snapshot
    volumeSnapshotClassName: rawfile-localpv
    # Rawfile snapshots stay on the node of the source PVC. Run the mover next to the
    # app pod so the snapshot-backed PVC it mounts is provisioned on that same node.
    moverAffinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                instance: technitium-0
            topologyKey: kubernetes.io/hostname
---
