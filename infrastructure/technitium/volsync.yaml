            topologyKey: kubernetes.io/hostname
---
# Restore through the VolSync volume populator: the PVC (dataSourceRef) stays Pending until
# this restore finished. Flux creates it once (ssa: IfNotPresent), so the PVCs that
# already exist are left alone; the Deployment mounts it by name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-technitium-0
  labels:
    app: technitium
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  annotations:
    # Never let Flux delete the data volume.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rawfile-localpv
  resources:
    requests:
      storage: 2Gi
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: technitium-0
---
