apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
spec:
  serviceName: technitium
  replicas: 2
  minReadySeconds: 10
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      # Why hostNetwork: Technitium clustering registers each node by a static
      # IP and builds the cluster zone's transfer ACL and NOTIFY list from those
      # IPs. Pod IPs change on every restart, and traffic between pods keeps the
      # pod IP as source, so a LoadBalancer IP per pod would be rejected by the
      # ACL. With hostNetwork each node is its Talos node IP, which is stable
      # because the rawfile-localpv volume pins each pod to its node. Clients
      # (DHCP) also see real client IPs for logs and per-client blocking.
      #
      # Talos hostDNS already listens on 127.0.0.53:53 and 169.254.116.108:53
      # in the host namespace, so Technitium's default 0.0.0.0:53 bind fails on
      # first boot (logged, not fatal). After first start set
      # Settings > General > "DNS Server Local End Points" to <node-ip>:53 on
      # each node. It is node-specific and persists on the PVC.
      hostNetwork: true
      dnsPolicy: Default
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: technitium
              topologyKey: kubernetes.io/hostname
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: technitium
          image: docker.io/technitium/dns-server:15.6.2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Read only on first start (when /etc/dns has no config yet).
            # Joining the cluster later renames the server into the cluster
            # domain and replaces users with the primary's.
            - name: DNS_SERVER_DOMAIN
              value: $(POD_NAME)
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: /run/secrets/technitium/admin-password
            - name: DNS_SERVER_LOG_USING_LOCAL_TIME
              value: "true"
            # Keeps the logs from filling the 2Gi volume (first start only).
            - name: DNS_SERVER_LOG_MAX_LOG_FILE_DAYS
              value: "30"
            - name: TZ
              value: Asia/Riyadh
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 5380
              protocol: TCP
            - name: web-https
              containerPort: 53443
              protocol: TCP
          # The image runs as root and has no file capabilities; a non-root
          # user cannot bind port 53 even with NET_BIND_SERVICE added.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          # The health-check API is unauthenticated only from loopback and
          # reports failure in the JSON body with HTTP 200, so an httpGet probe
          # from kubelet would always pass. Same check as upstream compose.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS --max-time 5 http://127.0.0.1:5380/api/dnsClient/healthCheck | grep -q '"status":"ok"'
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS --max-time 5 http://127.0.0.1:5380/api/dnsClient/healthCheck | grep -q '"status":"ok"'
            periodSeconds: 15
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Large blocklists are held in memory.
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/dns
            # Keep the logs on the PVC. otherwise /var/log/technitium is is read-only and the container fails to start
            - name: config
              mountPath: /var/log/technitium
              subPath: logs
            - name: admin-password
              mountPath: /run/secrets/technitium
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: admin-password
          secret:
            secretName: technitium-admin
            items:
              - key: password
                path: admin-password
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rawfile-localpv
        resources:
          requests:
            storage: 2Gi
