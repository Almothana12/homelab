# for managment interface only
# NGINX (F5) instead of Cilium: Cilium Ingress cannot talk HTTPS to a backend.
# The backend is Technitium's HTTPS port (53443, its self-signed cert) so that
# "HTTP to HTTPS redirect" can be enabled and nothing on the LAN is plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium
  annotations:
    nginx.org/ssl-services: technitium-web
spec:
  ingressClassName: nginx
  rules:
    - host: dns.almothana.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: technitium-web
                port:
                  number: 53443
  tls:
    - hosts:
        - dns.almothana.xyz
      secretName: almothana-xyz-tls
