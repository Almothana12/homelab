---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-benchmark-gate
  namespace: ai
rules:
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies]
    resourceNames: [llm-benchmark-maintenance]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-benchmark-gate
  namespace: ai
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-benchmark-gate
