apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm-production-stack
spec:
  interval: 5m
  # Allow image pulls, model loading and GPU warmup to finish during an upgrade.
  timeout: 45m
  chart:
    spec:
      chart: vllm-stack
      version: '0.1.12'
      sourceRef:
        kind: HelmRepository
        name: vllm-production-stack
      interval: 5m
  # Chart 0.1.12 hardcodes a 20-minute Deployment progress deadline.
  # Keep it longer than the 30-minute model startup probe below.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: vllm-production-stack-qwen-38-27b-nvfp4-deployment-vllm
            patch: |
              - op: replace
                path: /spec/progressDeadlineSeconds
                value: 2400
  values: # https://github.com/vllm-project/production-stack/blob/main/helm/values.yaml
    servingEngineSpec:
      # Global runtime class for all models (can be overridden per model)
      runtimeClassName: "nvidia"
      serviceMonitor:
        enabled: true

      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

      # Model loading, compilation and warmup exceed the default 10-minute budget.
      startupProbe:
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 180
        timeoutSeconds: 5
        httpGet:
          path: /health
          port: 8000

      # Global tolerations applied to all model deployments
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      modelSpec:
      - name: "qwen-38-27b-nvfp4"
        modelURL: "nvidia/Qwen3.8-27B-NVFP4"
        repository: "vllm/vllm-openai"
        tag: "v0.29.0"
        replicaCount: 1
        requestCPU: 6
        requestMemory: "16Gi"
        requestGPU: 1
        pvcStorage: "50Gi"
        enableTool: true
        toolCallParser: "qwen3_coder"
        vllmConfig:
          gpuMemoryUtilization: 0.72
          enablePrefixCaching: true
          maxNumSeqs: 16
          extraArgs:
          - "--kv-cache-dtype"
          - "fp8"
          - "--reasoning-parser"
          - "qwen3"
          - "--speculative-config"
          - '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":8}'
          # Optional accuracy parity with SGLang (--mamba-ssm-dtype=float32):
          # keeps hybrid GDN recurrent state in fp32 instead of the model dtype.
          # Costs a little memory; uncomment if fp8 KV drift is a concern.
          # - "--mamba-ssm-cache-dtype"
          # - "float32"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: VLLM_CACHE_ROOT
          value: /data/vllm-cache
        - name: CUDA_CACHE_PATH
          value: /data/nv-compute-cache

    routerSpec:
      repository: "lmcache/lmstack-router"
      tag: "v0.1.12"
      startupProbe:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 24
        timeoutSeconds: 5
        httpGet:
          path: /health
          port: router-port
      serviceMonitor:
        enabled: true
      ingress:
        enabled: true
        className: cilium
        hosts:
          - host: vllm.almothana.xyz
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: almothana-xyz-tls
            hosts:
              - vllm.almothana.xyz

    grafanaDashboards:
      enabled: true
