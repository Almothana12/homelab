apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pangolin-egress
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: stalwart
            k8s:app.kubernetes.io/name: stalwart
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP
  egressDeny:
    - toEntities:
        - ingress
        - host
        - remote-node
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    - toCIDR:
        - 195.20.235.239/32
        - 2001:ba0:250:2b00::1/128
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "0"
              endPort: 65535
              protocol: UDP
