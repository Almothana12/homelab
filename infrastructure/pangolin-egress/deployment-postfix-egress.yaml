# Outbound mail path: Stalwart -> this pod -> Pangolin tunnel -> VPS Postfix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix-egress
  labels:
    app: postfix-egress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postfix-egress
  template:
    metadata:
      labels:
        app: postfix-egress
    spec:
      containers:
        - name: pangolin-cli
          image: docker.io/fosrl/pangolin-cli:0.19.0
          env:
            - name: PANGOLIN_ENDPOINT
              value: https://pangolin.almothana.sa
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pangolin-egress-auth
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pangolin-egress-auth
                  key: CLIENT_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
        - name: socat
          image: docker.io/alpine/socat:1.8.1.3
          args:
            - -d 
            - -d
            - TCP-LISTEN:2525,fork,reuseaddr
            - TCP:100.96.128.14:25,connect-timeout=10
          ports:
            - name: smtp
              containerPort: 2525
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
