apiVersion: v1
kind: Namespace
metadata:
  name: pangolin-egress
  labels:
    # pangolin-cli creates a kernel WireGuard tun device: it needs NET_ADMIN and
    # /dev/net/tun (hostPath), neither of which the baseline profile allows.
    # Kept in its own namespace so stalwart/newt stay on baseline.
    pod-security.kubernetes.io/enforce: privileged
