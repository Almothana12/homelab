apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
spec:
  discoveryFilters:
    - Almothana12/homelab
  image: renovate/renovate:44.181.3
  parallelism: 3
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_PR_HOURLY_LIMIT
      value: "3"
    - name: RENOVATE_PR_CONCURRENT_LIMIT
      value: "0"
  provider:
    name: github
    endpoint: "https://api.github.com"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Every 6h
  schedule: "40 0,6,12,18 * * *"
  githubAppReference:
    secretName: github-app-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
