apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-38-27b-fp8
  namespace: default
  labels:
    app: qwen-38-27b-fp8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-38-27b-fp8
  template:
    metadata:
      labels:
        app: qwen-38-27b-fp8
    spec:
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: qwen-38-27b-fp8
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
      containers:
      - name: qwen-38-27b-fp8
        image: vllm/vllm-openai:v
        command: ["/bin/sh", "-c"]
        args: [
          "vllm serve Qwen/Qwen3.8-27B-FP8  --tensor-parallel-size 1  --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3  --mm-encoder-tp-mode data"
        ]
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "10"
            memory: 20G
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8000
        #   initialDelaySeconds: 60
        #   periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5