apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - helmrelease-hubble.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
    options:
      disableNameSuffixHash: true
  - name: alloy-hubble-config
    files:
      - config-hubble.alloy
    options:
      disableNameSuffixHash: true
