apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  dependsOn:
    - name: istio-base
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: istiod
      version: "1.29.2"
      sourceRef:
        kind: HelmRepository
        name: istio
      interval: 24h
  values:
    # Small deployment for Gateway API Inference Extension, which is only used for llm-d.
    autoscaleEnabled: false
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi

    pilot:
      env:
        ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true" # required for llm-d https://llm-d.ai/docs/infrastructure/gateway/istio
