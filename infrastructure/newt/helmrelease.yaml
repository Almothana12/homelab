apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
spec:
  interval: 5m
  chart:
    spec:
      chart: newt
      version: '1.5.0'
      sourceRef:
        kind: HelmRepository
        name: fossorial
      interval: 5m
  values: 
    global:
      image:
        registry: docker.io
        repository: fosrl/newt
        tag: "1.16.0"
    newtInstances:
      - name: main-tunnel
        enabled: true
        acceptClients: true
        auth:
          existingSecretName: newt-main-tunnel-auth