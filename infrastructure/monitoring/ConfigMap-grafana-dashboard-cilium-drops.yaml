apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cilium-drops
  labels:
    # Discovered by the Grafana sidecar in kube-prometheus-stack.
    grafana_dashboard: "1"
data:
  cilium-drops.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Overview of packets dropped by Cilium/Hubble, using hubble_drop_total.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Total Hubble drops during the selected dashboard time range.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])) or vector(0)",
              "instant": true,
              "legendFormat": "drops",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Drops in selected range",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Drops caused specifically by Cilium network-policy enforcement.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(hubble_drop_total{reason=\"POLICY_DENIED\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])) or vector(0)",
              "instant": true,
              "legendFormat": "policy denied",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Policy-denied drops",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current per-second drop rate over the automatic Grafana rate interval.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__rate_interval])) or vector(0)",
              "instant": true,
              "legendFormat": "drops/s",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Current drop rate (packets/s)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Number of source/destination/reason combinations that dropped at least one packet in the selected range.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(sum by (source, destination, reason) (increase(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])) > 0) or vector(0)",
              "instant": true,
              "legendFormat": "paths",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Affected paths",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Drop rate grouped by Cilium's drop reason.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": true,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (reason) (rate(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__rate_interval]))",
              "legendFormat": "{{reason}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Drop rate by reason (packets/s)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Top source namespaces or reserved identities by total drops. Empty endpoint metadata is shown explicitly as unattributed node/network traffic.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 6,
          "options": {
            "displayMode": "gradient",
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(10, label_replace(sum by (source) (increase(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])), \"source\", \"unattributed node/network traffic\", \"source\", \"^$\")) > 0",
              "instant": true,
              "legendFormat": "{{source}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Top drop sources",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Top destination namespaces or reserved identities by total drops. Empty endpoint metadata is shown explicitly as unattributed node/network traffic.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 7,
          "options": {
            "displayMode": "gradient",
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(10, label_replace(sum by (destination) (increase(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])), \"destination\", \"unattributed node/network traffic\", \"destination\", \"^$\")) > 0",
              "instant": true,
              "legendFormat": "{{destination}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Top drop destinations",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Aggregated dropped paths. Workload and traffic-direction columns appear after the updated Hubble metric context is deployed; use the Loki panel below for exact pod, IP, and port details.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "id": 8,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "enablePagination": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "label_replace(label_replace(sum by (source, source_workload, destination, destination_workload, traffic_direction, reason, protocol) (increase(hubble_drop_total{reason=~\"$reason\", protocol=~\"$protocol\", source=~\"$source\", destination=~\"$destination\"}[$__range])) > 0, \"source\", \"unattributed\", \"source\", \"^$\"), \"destination\", \"unattributed\", \"destination\", \"^$\")",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Dropped paths (metrics)",
          "type": "table"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Exact Hubble drop events from the dedicated file collector. Expand a row to inspect pod names, IPs, ports, observer node, and the original flow JSON. This panel follows the reason, source, and destination dashboard filters.",
          "gridPos": {
            "h": 15,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "id": 9,
          "options": {
            "dedupStrategy": "none",
            "enableInfiniteScrolling": false,
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "pluginVersion": "12.0.0",
          "targets": [
            {
              "direction": "backward",
              "editorMode": "code",
              "expr": "{cluster=\"homelab\", log_type=\"hubble-flow\", verdict=~\"DROPPED|ERROR\", drop_reason=~\"$reason\", source_namespace=~\"$source\", destination_namespace=~\"$destination\"} | line_format \"{{.source_namespace}}/{{.source_pod}} ({{.source_ip}}) -> {{.destination_namespace}}/{{.destination_pod}} ({{.destination_ip}}) {{.protocol}} {{.traffic_direction}} reason={{.drop_reason}}\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Actionable dropped flows (Loki)",
          "type": "logs"
        }
      ],
      "preload": false,
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "cilium",
        "hubble",
        "network",
        "drops"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "label": "Prometheus",
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(hubble_drop_total, reason)",
            "includeAll": true,
            "label": "Reason",
            "multi": true,
            "name": "reason",
            "options": [],
            "query": {
              "query": "label_values(hubble_drop_total, reason)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(hubble_drop_total, protocol)",
            "includeAll": true,
            "label": "Protocol",
            "multi": true,
            "name": "protocol",
            "options": [],
            "query": {
              "query": "label_values(hubble_drop_total, protocol)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(hubble_drop_total, source)",
            "includeAll": true,
            "label": "Source",
            "multi": true,
            "name": "source",
            "options": [],
            "query": {
              "query": "label_values(hubble_drop_total, source)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(hubble_drop_total, destination)",
            "includeAll": true,
            "label": "Destination",
            "multi": true,
            "name": "destination",
            "options": [],
            "query": {
              "query": "label_values(hubble_drop_total, destination)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Cilium / Dropped Packets",
      "uid": "cilium-dropped-packets",
      "version": 1
    }
