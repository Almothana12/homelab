# Grafana dashboard for llama.cpp (llama-server --metrics), one series per
# Prometheus job (= the Service name of each ServiceMonitor-scraped deployment).
#
# Generation counters (tokens_predicted_*, spec_decode_*) are only flushed when a
# request finishes, and the llamacpp:*_tokens_seconds gauges are reset by every
# /metrics scrape, so all speeds here are counter ratios over a window.
# This llama.cpp build (b11515) exports no KV-cache metric.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-llamacpp
  labels:
    # Discovered by the Grafana sidecar in kube-prometheus-stack.
    grafana_dashboard: "1"
data:
  llamacpp.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "title": "DGX Spark (GB10) nodes",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/dgx-spark-gb10-gpu",
          "keepTime": true,
          "targetBlank": false
        },
        {
          "title": "vLLM",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/vllm-inference-memory",
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview (speeds and ratios are averaged over the selected time range)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Scrape target",
          "description": "Prometheus `up` for the llama-server /metrics endpoint. DOWN means the pod is gone, still loading the model (the endpoint answers 503 until load finishes), or --metrics is missing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "no target",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (job) (up{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Slots busy now",
          "description": "llamacpp:requests_processing — requests currently holding a slot (prefill or decode).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (llamacpp:requests_processing{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Deferred now",
          "description": "llamacpp:requests_deferred — requests waiting because every slot (--parallel) is busy. Anything above 0 for long means users are queueing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (llamacpp:requests_deferred{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Decode speed / request",
          "description": "Generated tokens per second of generation time, per request, time-weighted over the range: tokens_predicted_total / tokens_predicted_seconds_total. This is what a single user sees.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:tokens_predicted_total{job=~\"$job\"}[$__range])) / sum by (job) (rate(llamacpp:tokens_predicted_seconds_total{job=~\"$job\"}[$__range]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Prefill speed",
          "description": "Prompt tokens evaluated per second of prompt processing: prompt_tokens_total / prompt_seconds_total (cached tokens excluded).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:prompt_tokens_total{job=~\"$job\"}[$__range])) / sum by (job) (rate(llamacpp:prompt_seconds_total{job=~\"$job\"}[$__range]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Prompt cache hit",
          "description": "Share of prompt tokens reused from the slot cache instead of being recomputed: cached / (cached + processed).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (increase(llamacpp:prompt_tokens_cached_total{job=~\"$job\"}[$__range])) / (sum by (job) (increase(llamacpp:prompt_tokens_cached_total{job=~\"$job\"}[$__range])) + sum by (job) (increase(llamacpp:prompt_tokens_total{job=~\"$job\"}[$__range])))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Tokens / verify step",
          "description": "Speculative decoding: tokens emitted per target-model verification step = 1 + accepted / drafts. 1.0 = drafter useless; the ceiling is 1 + --spec-draft-n-max. Empty for deployments without a drafter.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "no drafter",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1.5
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "1 + sum by (job) (increase(llamacpp:spec_decode_num_accepted_tokens_total{job=~\"$job\"}[$__range])) / sum by (job) (increase(llamacpp:spec_decode_num_drafts_total{job=~\"$job\"}[$__range]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Longest sequence seen",
          "description": "llamacpp:n_tokens_max — the longest prompt+generation any slot has held since the pod started. Compare with --ctx-size (per slot); at the limit llama-server shifts or truncates context.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (job) (llamacpp:n_tokens_max{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Throughput and speed",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Server throughput (all slots)",
          "description": "Aggregate tokens/s the server produced. Generation counters are flushed when a request FINISHES, so a long stream shows up as one burst at its end; prompt counters update per batch.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "lineInterpolation": "smooth",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:tokens_predicted_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{job}} generated",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:prompt_tokens_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{job}} prompt evaluated",
              "refId": "B",
              "range": true
            }
          ],
          "interval": "1m"
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Decode speed per request",
          "description": "Time-weighted tokens/s of the requests that finished in each window (counter ratio, so it is not reset by scrapes the way the llamacpp:predicted_tokens_seconds gauge is). Gaps = no request finished.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "lineInterpolation": "smooth",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:tokens_predicted_total{job=~\"$job\"}[$__rate_interval])) / sum by (job) (rate(llamacpp:tokens_predicted_seconds_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "range": true
            }
          ],
          "interval": "1m"
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Prefill speed",
          "description": "Prompt tokens/s while prefill is running. Drops with very long prompts (attention cost grows with context) and when prefill shares batches with decoding slots.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tok/s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "lineInterpolation": "smooth",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (job) (rate(llamacpp:prompt_tokens_total{job=~\"$job\"}[$__rate_interval])) / sum by (job) (rate(llamacpp:prompt_seconds_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "range": true
            }
          ],
          "interval": "1m"
        },
        {
          "id": 14,
          "type": "row",
          "title": "Load and scheduling",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Slots busy and requests deferred",
          "description": "Busy = requests holding a slot. Deferred = requests waiting for a free slot. Sustained deferral means --parallel is too low for the load (or the GPU is saturated and raising it will not help).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*deferred"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
