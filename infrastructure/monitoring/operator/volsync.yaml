apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
    name: grafana
spec:
    sourcePVC: storage-kube-prometheus-stack-grafana-0
    trigger:
        schedule: 0 4 * * *
    restic:
        pruneIntervalDays: 7
        repository: restic-config-grafana
        retain:
            hourly: 1
            daily: 7
            weekly: 4
            monthly: 2
            yearly: 1
        copyMethod: Snapshot
        volumeSnapshotClassName: rawfile-localpv
        # Rawfile snapshots stay on the node of the source PVC. Run the mover next to the
        # app pod so the snapshot-backed PVC it mounts is provisioned on that same node.
        moverAffinity:
            podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                            statefulset.kubernetes.io/pod-name: kube-prometheus-stack-grafana-0
                      topologyKey: kubernetes.io/hostname
        moverSecurityContext:
            runAsUser: 472
