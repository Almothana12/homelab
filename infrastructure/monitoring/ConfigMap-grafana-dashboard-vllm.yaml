        {
          "id": 23,
          "type": "text",
          "title": "How to size the KV cache from this dashboard",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 45
          },
          "options": {
            "mode": "markdown",
            "content": "\nThis dashboard contains **no hardcoded numbers** — capacity comes from\n`vllm:cache_config_info` labels, occupancy from `vllm:kv_cache_usage_perc`.\n\n**To decide whether the cache is too large**, use ratios only:\n\n1. **Peak KV over 7d** — if it reads *P%*, the cache is roughly `100/P`x larger\n   than the workload has ever required.\n2. **Preemptions (24h)** — must be **0**. Non-zero means the cache is already\n   too small, regardless of what the usage percentage says.\n3. **Prompt length p99** vs **KV capacity (tokens)** in the config table — the\n   capacity should be proportionate to real traffic plus the concurrency you\n   intend to support.\n\n**To apply a new size**, prefer pinning it explicitly over guessing at a\nutilisation fraction. vLLM computes and prints the exact value at startup:\n\n```bash\nkubectl -n ai logs <pod> | grep gpu_worker.py:860\n```\n\nIt emits a ready-to-use `--kv-cache-memory=<bytes>` for both \"fit the current\nrequest\" and \"use all memory\". Setting that flag makes the reservation explicit\nin Git rather than an emergent property of a percentage. After the change, this\ndashboard's config table shows the new capacity automatically — nothing to edit\nhere.\n\n*Why there is no \"weights vs KV vs activation\" pie chart:* vLLM does not export\nthat split as metrics in any released version (checked against\n`vllm/v1/metrics/loggers.py`). It is printed once at startup only. A pie chart\nwould therefore have to hardcode numbers that silently go stale, so this\ndashboard deliberately shows the live config table instead.\n"
          }
        }
