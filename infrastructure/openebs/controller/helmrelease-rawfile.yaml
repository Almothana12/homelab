apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rawfile-localpv
spec:
  interval: 24h
  chart:
    spec:
      chart: rawfile-localpv
      version: '0.15.3'
      sourceRef:
        kind: HelmRepository
        name: rawfile-localpv
        namespace: openebs
      interval: 24h
  values:
    global:
      analytics:
        enabled: false
    analytics:
      enabled: false
    crds:
      csi:
        volumeSnapshots:
          # Installed by the external-snapshotter HelmRelease.
          enabled: false
    capabilities:
      apiServer:
        # Optional REST API for introspection (~200Mi, 0.2 CPU).
        enabled: false
    node:
      # The cluster's snapshot-controller runs with --enable-distributed-snapshotting.
      snapshotController:
        enabled: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      metadataDirPath: /var/mnt/local-storage/rawfile/meta
      defaultPool: local-storage
      storagePools:
        default: null
        local-storage:
          # The XFS user volume (omni/patches/storage.yaml), formatted with reflink, so
          # snapshots and clones are copy-on-write.
          path: /var/mnt/local-storage/rawfile/pool/
          reservedCapacity: "10%"
          reservedCapacityMode: plain
    storageClasses:
      - name: rawfile-localpv
        enabled: true
        isDefault: true
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        reclaimPolicy: Delete
        # Not xfs: a restored or cloned volume keeps the filesystem UUID, and XFS refuses to
        # mount a duplicate UUID on the same node.
        fsType: ext4
        # The chart renders the empty default as "<nil>", which the driver reads as off.
        copyOnWrite: "true"
        # Flush and freeze the filesystem during a snapshot; otherwise data still in page
        # cache is missing from the snapshot.
        freezeFs: "true"
    snapshotClasses:
      - name: rawfile-localpv
        enabled: true
        # The chart renders isDefault: true as invalid YAML. VolSync names the class itself.
        isDefault: false
        deletionPolicy: Delete
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true