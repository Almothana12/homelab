apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lws
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: lws
      version: '0.10.0'
      sourceRef:
        kind: HelmRepository
        name: lws
      interval: 5m
  # Keep the LeaderWorkerSet CRDs in sync with the chart on upgrades
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values: {}
